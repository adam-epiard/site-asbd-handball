# Déploiement automatique.
#
# Chaque push sur main : vérification TypeScript et des données, build,
# puis publication du dossier dist/ sur la branche « deploy ».
# L'hébergement OVH suit la branche deploy (intégration Git du Multisite)
# et récupère la nouvelle version via le webhook GitHub.
#
# Si une étape échoue, rien n'est publié : la version en ligne ne change pas.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vérifier TypeScript et le contenu
        run: npm run check

      - name: Construire le site
        run: npm run build

      - name: Publier sur la branche deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          # Pas de force_orphan : OVH fait un « git pull » de la branche,
          # qui échouerait si son historique était réécrit à chaque build.
          # Pas de fichier .nojekyll : inutile chez OVH.
          enable_jekyll: true
          commit_message: ${{ github.event.head_commit.message }}
